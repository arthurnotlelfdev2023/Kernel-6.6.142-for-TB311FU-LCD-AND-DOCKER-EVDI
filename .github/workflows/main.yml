name: GKI 6.6 LTS Compilation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs rsync curl python3 python3-pip libssl-dev bison flex bc build-essential zip unzip ca-certificates
          sudo curl https://googleapis.com -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Initialize and Sync Android 15 Kernel Source
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6-lts
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Create Kernel Config Fragments (Docker & LCD)
        run: |
          # Fragmento para suporte ao Docker dentro do Android
          echo -e "# Docker Support\nCONFIG_BRIDGE=y\nCONFIG_VETH=y\nCONFIG_TUN=y\nCONFIG_IP_NF_TARGET_MASQUERADE=y\nCONFIG_NETFILTER_XT_MATCH_COMMENT=y\nCONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y\nCONFIG_NETFILTER_XT_MARK=y\nCONFIG_NETFILTER_XT_CONNMARK=y\nCONFIG_CGROUP_DEVICE=y\nCONFIG_MEMCG=y\nCONFIG_MEMCG_SWAP=y\nCONFIG_OVERLAY_FS=y" > common/docker_support.config
          
          # Fragmento para suporte a displays LCD
          echo -e "# LCD Support\nCONFIG_DRM_PANEL=y\nCONFIG_DRM_PANEL_ORIENTATION_QUIRKS=y\nCONFIG_BACKLIGHT_CLASS_DEVICE=y\nCONFIG_LCD_CLASS_DEVICE=y\nCONFIG_DRM_MIPI_DSI=y" > common/lcd_support.config

      - name: Execute Bazel/Kleaf Compile
        run: |
          chmod +x tools/bazel
          tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: Upload Compiled Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel-6.6-artifacts
          path: |
            bazel-bin/common/kernel_aarch64_dist/Image
            bazel-bin/common/kernel_aarch64_dist/*.ko
          retention-days: 5
