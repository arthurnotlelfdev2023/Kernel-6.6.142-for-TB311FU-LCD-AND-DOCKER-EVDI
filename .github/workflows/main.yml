name: GKI 6.6 LTS Compilation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs rsync curl python3 python3-pip libssl-dev bison flex bc build-essential zip unzip ca-certificates
          sudo curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Initialize and Sync Android 15 Kernel Source
        run: |
          # Inicializando com a branch correta do manifesto GKI
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6-lts --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Create Kernel Config Fragments (Docker, LXC, LCD, EVDI, KVM EL2 & MTK)
        run: |
          # Fragmento para suporte ao Docker e LXC (Containers) dentro do Android
          cat << 'EOF' > common/docker_lxc_support.config
          # Docker & LXC Core Support
          CONFIG_BRIDGE=y
          CONFIG_VETH=y
          CONFIG_TUN=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_OVERLAY_FS=y
          
          # LXC Specific Namespaces & Isolation
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CPUSETS=y
          EOF
          
          # Fragmento para suporte a displays LCD e EVDI (Virtual Display)
          cat << 'EOF' > common/lcd_evdi_support.config
          # LCD & DRM Support
          CONFIG_DRM_PANEL=y
          CONFIG_DRM_PANEL_ORIENTATION_QUIRKS=y
          CONFIG_BACKLIGHT_CLASS_DEVICE=y
          CONFIG_LCD_CLASS_DEVICE=y
          CONFIG_DRM_MIPI_DSI=y
          
          # EVDI Driver Dependencies
          CONFIG_DRM=y
          CONFIG_DRM_KMS_HELPER=y
          CONFIG_FB=y
          EOF

          # Fragmento para Virtualização (KVM no EL2) e compatibilidade MediaTek (MTK)
          cat << 'EOF' > common/kvm_mtk_support.config
          # ARM64 KVM EL2 Virtualization Core
          CONFIG_VIRTUALIZATION=y
          CONFIG_KVM=y
          CONFIG_HAVE_KVM_IRQCHIP=y
          CONFIG_HAVE_KVM_IRQ_BYPASS=y
          CONFIG_HAVE_KVM_MSI=y
          CONFIG_KVM_MMIO=y
          CONFIG_KVM_GENERIC_DIRTYLOG_READ_PROTECT=y
          CONFIG_KVM_XFER_TO_GUEST_MODE=y
          
          # MediaTek IOMMU / MTK Virtualization Extensions
          CONFIG_MTK_IOMMU=y
          CONFIG_MTK_IOMMU_V2=y
          CONFIG_ARM_SMMU=y
          CONFIG_IOMMU_SUPPORT=y
          EOF

      - name: Execute Bazel/Kleaf Compile
        run: |
          chmod +x tools/bazel
          tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: Upload Compiled Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel-6.6-artifacts
          path: |
            bazel-bin/
            bazel-bin/
          retention-days: 5
